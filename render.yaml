services:
  - type: web
    name: brand-support-ai-agent
    runtime: python
    buildCommand: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
    startCommand: ".venv/bin/python -m uvicorn src.dashboard.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
